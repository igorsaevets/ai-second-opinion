name: selftest

# Runs the behavioural test suite on every push and pull request.
#
# It needs NO credentials and contacts NO vendor: every check either uses --dry-run, points the
# CLI channels at binaries that do not exist, or exercises pure functions. That is a property
# worth keeping - a test suite that needs a paid key is a test suite nobody runs on a fork.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
        exclude:
          # One Python version per non-Linux runner is enough; the code is standard-library only.
          - os: macos-latest
            python: '3.9'
          - os: windows-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      # v7 pins land the two open dependabot PRs (#3, #4) at the SOURCE: this file is what
      # package.py ships, so merging them only in the generated repo would be silently undone
      # by the next build (the R53 lesson - a hand edit in the generated tree is not a change).
      # Both bumps ran green on all four CI matrix legs on the dependabot branches first.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every shipped script
        shell: bash
        run: |
          cd plugins/model-orchestration/skills/model-orchestration
          python -m compileall -q .

      - name: doctor (install probe; missing CLIs are expected here)
        shell: bash
        continue-on-error: true
        run: python plugins/model-orchestration/skills/model-orchestration/doctor.py

      - name: selftest (behaviour; must pass)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          # Explicitly empty so no runner-level key can ever be picked up by accident.
          MODEL_API_KEY: ''
        run: python plugins/model-orchestration/skills/model-orchestration/selftest.py

      # 🔴 The R34 guards (pre-commit + ruff + custom dup-key hook) exist in the tree but were
      # not enforced in CI. A fork contributor's PR was unguarded: the same defect class the
      # R33 panel caught by hand could re-enter through a PR that never ran pre-commit locally.
      # This step closes that gap.
      #
      # Fails loudly on any hook failure; run locally first with `pip install pre-commit &&
      # pre-commit run --all-files` from the kit root to reproduce.
      - name: pre-commit (JSON dup-key + ruff + syntax guards)
        shell: bash
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # 🔴 R86-И2: a tag push whose plugin.json / marketplace.json version does not match the tag
  # ships a release Claude Code will never surface, because the plugin update path decides
  # "is there a new release" from the manifest `version` field alone (docs: "users only receive
  # updates when you change this field"). Before this job the only backstop was human memory,
  # and one hand-sync at v1.45.1 already shipped a tag whose VERSION file said 1.45.0 inside
  # (the R78 lesson). This job fails loudly on the tag itself, before the release object is
  # created by tools/backfill_releases.py.
  tag-version-matches:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: version fields in plugin.json and marketplace.json match the tag
        shell: bash
        run: |
          tag_v="${GITHUB_REF_NAME#v}"
          mv=$(python -c 'import json;print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          pv=$(python -c 'import json;print(json.load(open("plugins/model-orchestration/.claude-plugin/plugin.json"))["version"])')
          echo "tag=${GITHUB_REF_NAME}  tag_stripped=${tag_v}  marketplace.json=${mv}  plugin.json=${pv}"
          if [ "$mv" != "$tag_v" ]; then
            echo "::error::marketplace.json version ${mv} != tag v${tag_v} - Claude Code decides 'is there a new release' by this field; a stale value silently hides the tag"
            exit 1
          fi
          if [ "$pv" != "$tag_v" ]; then
            echo "::error::plugin.json version ${pv} != tag v${tag_v} - same field on the plugin manifest, also load-bearing"
            exit 1
          fi
